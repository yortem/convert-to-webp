name: Publish Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file EXE
        run: |
          dotnet publish ConvertToWebP.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false -p:EnableCompressionInSingleFile=true -o publish

      - name: Create ZIP
        run: |
          Compress-Archive -Path publish\* -DestinationPath ConvertToWebP-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ConvertToWebP-win-x64.zip
            publish/ConvertToWebP.exe
          generate_release_notes: true
